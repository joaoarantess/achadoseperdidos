<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Mural de achados e perdidos{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topo">
    <a class="marca" href="{{ url_for('index') }}">Achados &amp; Perdidos</a>
    <a class="botao" href="{{ url_for('novo') }}">Cadastrar item</a>
  </header>

  <main class="pagina">
    {% with mensagens = get_flashed_messages(with_categories=true) %}
      {% if mensagens %}
        <ul class="avisos" role="status">
          {% for categoria, texto in mensagens %}
            <li class="aviso aviso-{{ categoria }}">{{ texto }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
